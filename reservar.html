<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Reservar consulta — Lambertotarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#150709; --bg-2:#1c0b0e; --text:#f4e9e4; --text-muted:#c8a8a2;
    --accent:#c9203c; --gold:#c8a35f; --border:rgba(244,233,228,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100svh; background:var(--bg); color:var(--text);
    font-family:'Manrope', system-ui, sans-serif; line-height:1.6;
  }
  header{
    padding:1.6rem 1.25rem 1.1rem; text-align:center; border-bottom:1px solid var(--border);
    background:var(--bg-2);
  }
  a.back{color:var(--text-muted); font-size:0.85rem; text-decoration:none; display:inline-block; margin-bottom:0.7rem;}
  a.back:hover{color:var(--gold);}
  h1{font-family:'Cinzel', Georgia, serif; font-size:1.4rem; margin:0; text-wrap:balance;}
  p.sub{color:var(--text-muted); font-size:0.9rem; max-width:40ch; margin:0.6rem auto 0;}
  #cal-booking{width:100%; min-height:75vh;}
  noscript{display:block; padding:2rem 1.25rem; text-align:center; color:var(--text-muted);}

  .whatsapp-floater{
    position:fixed;
    left:1rem;
    bottom:calc(1rem + env(safe-area-inset-bottom));
    z-index:20;
    width:46px;
    height:46px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#25D366;
    box-shadow:0 10px 24px rgba(0,0,0,0.4);
    color:#fff;
    text-decoration:none;
    transition:transform 0.15s ease;
  }
  .whatsapp-floater:hover{transform:translateY(-1px) scale(1.05);}
  .whatsapp-floater:active{transform:scale(0.94);}
  .whatsapp-floater:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  .whatsapp-floater svg{width:24px;height:24px;}
  @media (prefers-reduced-motion: reduce){
    .whatsapp-floater{transition:none;}
  }
</style>
</head>
<body>
  <header>
    <a class="back" href="/">&larr; Volver a la web</a>
    <h1>Reserva tu consulta</h1>
    <p class="sub">Elige el tipo de consulta, un hueco disponible y paga con tarjeta o Bizum. La reserva se confirma automáticamente al completar el pago.</p>
  </header>

  <div id="cal-booking"></div>
  <noscript>Activa JavaScript para ver el calendario de reservas, o escríbenos directamente.</noscript>

  <a class="whatsapp-floater" href="https://wa.me/34646716434?text=Hola%20Lamberto%2C%20tengo%20una%20consulta" target="_blank" rel="noopener noreferrer" aria-label="Escribir por WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.27-1.38a9.87 9.87 0 0 0 4.72 1.2h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.12h-.01a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.13.82.83-3.05-.19-.31a8.22 8.22 0 0 1-1.26-4.35c0-4.54 3.7-8.24 8.25-8.24a8.2 8.2 0 0 1 5.83 2.42 8.18 8.18 0 0 1 2.41 5.82c0 4.55-3.7 8.21-8.25 8.21Zm4.52-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.17.25-.64.81-.78.97-.14.17-.29.19-.53.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.44-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.43-.14-.01-.31-.01-.48-.01a.92.92 0 0 0-.67.31c-.23.25-.87.85-.87 2.08 0 1.23.89 2.41 1.02 2.58.12.17 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.55.1.47-.07 1.47-.6 1.68-1.18.2-.58.2-1.08.14-1.18-.06-.1-.22-.16-.47-.28Z"/></svg>
  </a>

  <script type="text/javascript">
    /* Cuenta real de Lamberto. Sin "/evento" al final para que el cliente
       vea primero la lista completa de duraciones (10/15/30/45/60 min). */
    var CALCOM_LINK = "lambertotarot";

    (function (C, A, L) {
      let p = function (a, ar) { a.q.push(ar); };
      let d = C.document;
      C.Cal = C.Cal || function () {
        let cal = C.Cal;
        let ar = arguments;
        if (!cal.loaded) {
          cal.ns = {};
          cal.q = cal.q || [];
          d.head.appendChild(d.createElement("script")).src = A;
          cal.loaded = true;
        }
        if (ar[0] === L) {
          const api = function () { p(api, arguments); };
          const namespace = ar[1];
          api.q = api.q || [];
          if (typeof namespace === "string") {
            cal.ns[namespace] = cal.ns[namespace] || api;
            p(cal.ns[namespace], ar);
            p(cal, ["initNamespace", namespace]);
          } else p(cal, ar);
          return;
        }
        p(cal, ar);
      };
    })(window, "https://app.cal.com/embed/embed.js", "init");

    Cal("init", { origin: "https://cal.com" });
    Cal("inline", {
      elementOrSelector: "#cal-booking",
      calLink: CALCOM_LINK,
      layout: "month_view",
      config: { theme: "dark" },
    });
    Cal("ui", {
      theme: "dark",
      styles: { branding: { brandColor: "#c9203c" } },
      hideEventTypeDetails: false,
    });

    // No usamos la redirección de pago propia de Cal.com (es una función de
    // pago de su plan Team). En su lugar, escuchamos el evento del propio
    // embed que se dispara al completar la reserva, y llevamos al cliente a
    // nuestra pasarela de Stripe nosotros mismos.
    Cal("on", {
      action: "bookingSuccessfulV2",
      callback: function (e) {
        var data = e.detail.data;
        if (!data || !data.uid) return;
        var minutos = 30;
        if (data.startTime && data.endTime) {
          minutos = Math.round((new Date(data.endTime) - new Date(data.startTime)) / 60000);
        }
        window.location.href = "/api/pagar?bookingUid=" + encodeURIComponent(data.uid) + "&duration=" + minutos;
      },
    });
  </script>
</body>
</html>
